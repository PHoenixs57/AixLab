# AixLab dev overlay: pin the product GUI off the default 3080 so it never
# collides with another dsh web instance on this machine.
# Usage: pnpm dsh web --patch dev.cordis.yml
- id: webserver
  config:
    # Bind all interfaces so the product is reachable from the LAN the same
    # way other dev services are; loopback stays available on 127.0.0.1:3090.
    host: 0.0.0.0
    port: 3090
