# Keyless real-Loader composition for the literature-attachments context
# injection. The test seeds one session with a `literature/attach` event,
# resumes it through the public agent service, and asserts the attached-
# papers block inside the runtime-context snapshot of the next turn.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext:
      maxBytes: 65536
      dshHome: !!js process.cwd() + '/.dsh'
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: literature-attachments
  name: '@deepseek-ai/dsh-literature-attachments'

# Await the persisted resume before the headless driver inspects root agents.
- id: resumed-agent
  name: './tests/fixtures/literature-attachments-agent.ts'
